<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- K 의 윗선·아랫선(y=24, y=104)을 수평으로 자른다 -->
    <clipPath id="cap"><rect x="-20" y="24" width="200" height="80"/></clipPath>
    <!-- 빨간 아랫다리는 윗팔의 아래쪽 모서리 선 아래쪽에서만 보이게 한다(경계가 딱 맞음) -->
    <clipPath id="below"><polygon points="-50,162.4 200,-45.9 200,200 -50,200"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="26" fill="#0a0a0b"/>
  <g transform="translate(-9 0)" clip-path="url(#cap)">
    <path d="M41 24V104" stroke="#f4f4f6" stroke-width="20"/>
    <path d="M39.2 75 110 16" stroke="#f4f4f6" stroke-width="20"/>
    <g clip-path="url(#below)"><path d="M44 58 112 115" stroke="#e0001b" stroke-width="20"/></g>
  </g>
</svg>
